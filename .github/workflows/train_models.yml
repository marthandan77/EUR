name: Scheduled model learning

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 0"

permissions:
  contents: write

concurrency:
  group: scheduled-model-learning
  cancel-in-progress: false

jobs:
  train-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch shared data, train all candidates, and audit promotion
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python train.py

      - name: Commit latest research report and promoted models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts
          if git diff --cached --quiet; then
            echo "No report or model changes to commit."
            exit 0
          fi
          git commit -m "Update scheduled model evaluation"
          git pull --rebase origin main
          git push origin main
